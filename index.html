    <h1 >A Poptimist Esolang</h1>
    <p >Inspired by the ethos of poptimism—the belief that pop music deserves serious critical recognition—this language reimagines programming as an expressive, playful, and inclusive act. 
      <br><br>
      Poptimism is designed to challenge traditional coding paradigms by integrating music, movement, and performance into its syntax.
<br><br>
      
      <b>Getting Started with Poptimism</b>
    <br><br>
      The core syntax follows a simple pattern:
      
          <br><br>
      <code>  [performer] plays [track] (optional actions); </code>
      
      <br><br>
          <b>1. Play a Track 🎶</b>
      <br><br>
      Just name your performer and the track. Try the code below which will start playing "Texas" by Beyoncé.
      <br><br>
      
          <code>beyonce plays texas;</code>
      
      <br><br>
       <b>2. Control Playback ⏯️</b>
     
      <br><br>
        Want to start and stop at a specific time? Use start and end. For example, the code below plays from second 20 to 50.
      <br><br>
      <code>beyonce plays texas (start 20, end 50);</code>
      
      <br><br>
      <b>Pause the track:</b>
      <br><br>
      <code>beyonce plays texas (pause);</code>
      <br><br>
      
      <b>Mute the track:</b>
      <br><br>
      <code>beyonce plays texas (mute);</code>
      <br><br>
      
      <b>Loop it endlessly:</b>
      <br><br>
      <code>beyonce plays texas (loop);</code>
      <br><br>
      
      <b>3. Combine multiple actions 🪩</b>
      <br><br>
      For example, the code below starts at second 20, ends at 50, mutes the sound, and loops forever!
      <br><br>
      <code>beyonce plays texas (start 20, end 50, mute, loop);</code>
    </p>
