<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" /> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kode Mono"/>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<!--     <script src="https://www.youtube.com/iframe_api"></script> -->

    <script src="https://unpkg.com/peggy"></script> 
  </head>
  
<body>

  <div id="app">  

<svg viewBox="0 0 1366 768" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="codeEditorContainer 1366x768">
<rect id="textEditor" x="42" y="103" width="625" height="565" rx="10" fill="#D9D9D9"/>
  <foreignobject x="42" y="103" width="625" height="565" >
  <textarea ref="textEditor" v-model="textEditor" v-on:keydown.shift.enter="evaluate"></textarea>
  </foreignobject> 
  
<rect id="videoDisplay" x="700" y="103" width="625" height="565" rx="10" fill="#D9D9D9"/>
   <foreignobject x="700" y="103" width="625" height="565" >
     <div  class="iframeContainer">       
     <iframe allow="autoplay" 
             v-for="x in url" 
             v-bind:src="x"></iframe>
    </div>
  </foreignobject>
  
<rect id="errorConsole" x="42" y="684" width="1283" height="59" rx="10" fill="#D9D9D9"/>
  <foreignobject x="42" y="684" width="1283" height="59">
  <p v-text="errorConsole"></p>
  </foreignobject>
  
<rect id="evalArea"  x="42" y="26" width="1278" height="55" fill="#D9D9D9"/>
<g id="evalButton" v-on:click="evaluate">
<rect x="69" y="41" width="93" height="36" rx="10" fill="black"/>
<text id="Eval" fill="#D9D9D9" xml:space="preserve" style="white-space: pre" font-family="Kode Mono" font-size="40" font-weight="bold" letter-spacing="0em"><tspan x="67.5312" y="72.4">Eval</tspan></text>
</g>
<g id="titleContainer">
<text id="title" fill="black" xml:space="preserve" style="white-space: pre" font-family="Kode Mono" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="730" y="69.52">A POPTIMIST PROGRAMMING LANGUAGE</tspan></text>
</g>
</g>
</svg>

    
  </div>
    <script src="vue.js"></script> 
  </body>
</html>
